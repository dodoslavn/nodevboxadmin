# Apache vhost for nodevboxadmin.
#
# Enable required modules first:
#   a2enmod proxy proxy_http ssl headers
#   systemctl restart apache2
#
# Node listens on 127.0.0.1:3000 only (see lib/config.js). Apache is the sole
# public entry point and terminates TLS. mod_proxy_http automatically adds the
# X-Forwarded-For header the app's rate limiter relies on.
#
# Replace nodevboxadmin.example.internal and the cert paths for your host.

<VirtualHost *:80>
    ServerName nodevboxadmin.example.internal
    # Force HTTPS.
    Redirect permanent / https://nodevboxadmin.example.internal/
</VirtualHost>

<VirtualHost *:443>
    ServerName nodevboxadmin.example.internal

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/nodevboxadmin.crt
    SSLCertificateKeyFile /etc/ssl/private/nodevboxadmin.key

    # --- TLS hardening ---
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # --- Security headers ---
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    # --- Reverse proxy to the Node app ---
    ProxyPreserveHost On
    ProxyPass "/" "http://127.0.0.1:3000/"
    ProxyPassReverse "/" "http://127.0.0.1:3000/"

    # Defense in depth: the app never serves from disk paths like /data, but
    # deny them explicitly in case ProxyPass is ever misconfigured.
    <LocationMatch "^/data/">
        Require all denied
    </LocationMatch>

    # Optional: restrict access to a trusted network. Uncomment + adjust.
    # <Location "/">
    #     Require ip 10.0.0.0/8 192.168.0.0/16
    # </Location>

    ErrorLog ${APACHE_LOG_DIR}/nodevboxadmin-error.log
    CustomLog ${APACHE_LOG_DIR}/nodevboxadmin-access.log combined
</VirtualHost>
